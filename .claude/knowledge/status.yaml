    state: done
    what: "feedback.py resolve <escalation.json> --id ... writes or links a fix record and marks the escalation resolved; hints.sh also returns matching fixes from fixes.jsonl, so a recorded fix reaches the context package, repair specs, and aider's own lint loop"
