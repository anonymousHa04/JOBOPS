milestone_3:
  # Product work, branch m3-engine. Engine spec: the m3-notes skill
  # (.agents/skills/m3-notes, mirrored in .claude/skills/m3-notes), adopted 2026-10-27;
  # where it differs from M3-NOTES.md, the skill wins.
  - id: m3-engine-spec
    state: done
    what: "m3-notes skill installed for Claude Code and shared agents; local coders get its matching sections through the context package's playbook section"
    changes_needed: "scoring to 55 must / 15 themes / 10 nice / 20 keywords with recency and must-have caps, labels supported_metric and skill_list_only; inverted index plus LLM judge for qualified requirements and index misses; evidence field on user bullets (number check against the answer); decision: reuse at equivalence >= 95 for any tailorable band, risk gate before rewording, tailor --all --dry-run; guard codes number_added, term_added, scope_raised, scope_phrase_added, too_long, fixed_field_changed; records in profile/records with content, bank, and engine hashes"
    work_split: "manager: ideal, equivalence, decide, guard, scoring and their tests; local coders: tailor CLI, MCP tool, YAML writer, prompt-3 wiring, lint"
    decisions_digest: "m3-notes references/decisions.md (2026-10-27): every agreed decision in one file; always included in full in context packages for product code (api/, jd-search/); context budgets raised to 4500 (aider) and 4000 (mini) to keep room for code context"
    review_aware: "tailoring loads profile/reviews/* locally, maps findings to engine actions or user questions, stores finding ids + status in the record (never the text), reports open ones"
  - id: m3-engine
    state: done
    blocked_on: user go-ahead; content equivalence formula
    what: selection, content equivalence, rewrite check, resume records, tailoring (requierements/jobops_resume_selection_generation_engine.md)
  - id: m3-engine-step-1a-scoring
    state: done
    what: "scoring per m3-notes engine-algorithm 2-3: inverted index over bullet text and tags; labels supported_metric/supported/partial/skill_list_only/learnable/not_demonstrated/unknown with credits x recency; 55 must / 15 themes / 10 nice / 20 literal keywords (must-have keywords x2), empty parts redistributed; must-have caps 84.9 / 74.9; years gate; index misses are unknown (never auto not_demonstrated); qualified requirements partial until judged; verdicts slot for the judge; risk check uses credit < 0.5"
    evidence: "fake-bank smoke 2026-10-27: every credit, cap, redistribution, and keyword weight matched by hand; check.sh pass, self-test 29/29, eval 44/44 (eval budget aligned to 4500)"
  - id: m3-engine-step-1b-judge
    state: done
    what: "api/src/scoring/judge.ts: local qwen2.5:7b (general7) judges needsJudge() requirements; candidates = index hits, else word-stem overlap, else most recent high-impact bullets (the model always decides); invented ids dropped; verdicts cached in SQLite judge_cache by requirement + prompt/candidate-logic version + bank hash; a judge 'no' keeps a listed skill at skill_list_only; score judges first (cache), --no-judge / judge=false uses cache only; risk uses cached verdicts; server down -> index labels + reported error"
    evidence: "fake JD 2026-10-27: judged 4 (production Kubernetes partial, Rust not_demonstrated by the model, Kafka/Go skill_list_only), re-score fully cached, --no-judge works, server down reported with the start command; check.sh pass, self-test 29/29, eval 44/44"
    calibrate: "generic tag matches (e.g. theme 'system design' supported via tag 'design') may be generous; tune on real JDs"
  - id: m3-engine-step-2-core
    state: done
    what: "api/src/tailor/ideal.ts (ideal content: must-have coverage first, then themes, impact, recency, id; budgets; every role >= 1 bullet; <= 2 metric-led per role; starting record's wording reused; reword marks for JD keywords missing literally, alias-only flagged; skills JD-first in JD spelling, nothing added; summary variant as written), equivalence.ts (spec 5 formula), decide.ts (pickStart on cached verdicts; years gate / poor bands -> not_tailored; reuse at >= 95; flags for unsupported must-haves and risks; risk gate blocks adapt, never reuse)"
    tests: "api/test/m3-engine.test.ts, 7 tests from engine-algorithm 8 plus invariants, fake resume only; total 29 tests pass"
    decided: "spec 5 formula as written (union + 2, with a skills unit), not its worked examples (union + 1); confirmed by the user 2026-10-28"
  - id: m3-engine-step-3-records
    state: done
    what: "api/src/tailor/records.ts: one YAML per JD in profile/records/ (id = jd id + content hash; original resume is record 'original'), written with wx so never overwritten; SQLite resume_records is an index rebuilt from YAML by loadRecords; content hash (sorted keys, reword marks excluded), bank hash, engine version (config values + judge prompt + logic version); hand-edited records reported and left out, stale bank/engine reported. ResumeRecordSchema replaced (decision original/reuse/adapt/not_tailored, flags, review_findings ids+statuses, hashes); old empty resume_records table dropped on open"
    tests: "3 record tests in api/test/m3-engine.test.ts"
  - id: m3-engine-step-4-guard
    state: done
    what: "api/src/tailor/guard.ts: checkRewrite (number_added, term_added except the bullet's reword keywords, scope_raised on the verb ladder, scope_phrase_added, too_long, number_led), checkFixedFields (title/company/dates byte-match the bank), guardedReword (one attempt, one retry with codes, then bank text; codes only)"
    tests: "3 guard tests in api/test/m3-engine.test.ts; total 35 tests pass"
  - id: m3-engine-step-5-reword
    state: done
    what: "api/src/tailor/reword.ts: prompt 3 (requierements/select-and-tailor.md) filled with a shortlist of one marked bullet, plus the spec's extra rules (allowed JD terms, keep numbers, never lead with a number, same verb level) and on retry the failure codes; qwen2.5:7b (general7); every answer checked by guardedReword against the bank text; changes recorded; model server down -> bullets unchanged, error reported"
    tests: "3 reword tests against a scripted fake model server; total 38 tests pass; not yet run against the real 7B model"
  - id: settings-env-file
    state: done
    what: ".env.example (committed) lists every setting with its default; .env (git-ignored) is a copy to edit. Loaded by api/src/env.ts (server, CLI, MCP server; shell variables win; tests never load it), .mcp.json jd-search launcher, llm.sh, retrieve.py; infra/qdrant compose reads QDRANT_DATA_DIR (docker compose --env-file .env). Rewording default switched to qwen2.5:14b (code, skill docs, llm.sh roles)"
  - id: m3-engine-step-6-tailor
    state: done
    what: "api/src/tailor/tailor.ts: planJob (start record incl. the original resume before it is written, ideal, risks, decision, unjudged count), tailorJob (blocked adapt writes nothing; original record written first; reuse writes the start's content as this JD's record; adapt rewords; not_tailored records the reason; evidence_refs), dryRunAll (decision table sorted by score + open risk questions with job ids; cached verdicts only, no files). tools.ts tailor/tailorAll (bank must be approved, judge first); CLI: tailor <job_id> [--dry-run] [--force], tailor --all --dry-run. loadPreferences added (budgets)"
    tests: "4 tailor tests (dry run, blocked, adapt then reuse, not_tailored); total 42 tests pass"
    open: "review_findings stays [] until m3-review-findings (below); same-company warning and lint are later steps; MCP tool is the last step"
  - id: m3-engine-step-7-template
    state: done
    what: "api/templates/resume.typ (adapted from stuxf/basic-typst-resume-template, Unlicense): one column, no icons/tables/header/footer, fixed standard section titles, data from data.json as plain strings, links as full URLs that never wrap, ligatures off. api/src/render/render.ts: record + bank fixed fields -> typst in a temp folder -> PDF kept in profile/pdf/<resume_id>.pdf only if parse-back passes. api/src/render/parseback.ts: two extractors (pdftotext/poppler and pdf.js) must both read back every bullet whole and in order, titles/employers/locations/dates, education, contact incl. full URLs and +91 phone, section order, skills; no icon glyphs; fonts embedded; page limit. CLI: render <resume_id>. Deps: typst 0.15.1 (brew), pdfjs-dist 6.4.299 (npm, Apache-2.0)"
    tests: "render + parse-back on the fake resume (skipped if typst/pdftotext missing) and a check that broken bullets, wrapped links, missing fields, icon glyphs are caught; total 44 tests"
    open: "OpenResume field-level parser (AGPL-3.0, run locally only, never copied into the repo): runner prepared in .scout/openresume-runner, but running downloaded code needs the user's permission; manual check on Greenhouse/Lever/Workday upload forms with the fake resume once per template change. RenderCV 2.8 installed (uv tool) as a cross-check renderer only"
  - id: m3-engine-step-8-lint
    state: done
    what: "api/src/tailor/lint.ts: lintRecord (gaps-and-rejection-risks 3: top_third_weak, inverted_evidence, no_scope_or_outcome, planned_work, skill_not_evidenced, soft_skill_listed, too_long (pages, <= 8 years), possible_typo (one letter from a known term; plurals and hyphen variants ignored), same_opening_verb (> 40%), metric_led_over_2, link_not_url, check_linkedin (manual)); each finding says who can fix it (engine/user/manual); reports only. tenure: short_tenure (< 12 months), gap (> 6 months; a year-only end counts as December), mixed_date_formats, date_unparsed. sameCompany: start from that company's record while its band is tailorable (one version across roles), warn at the 4th application and when versions differ. Wired into tailor (lint on the written record), tailor --all --dry-run (same_company codes per row), CLI lint <resume_id>. span() exported from score.ts"
    tests: "lint checks fire and never change the record; tenure (short, gap, mixed formats, year-only end); same company (start + reuse across roles, warning at the 4th application, other companies unaffected); 47 tests total"
    note: "fixed-field check is the renderer's job (bank values used as written) plus guard.checkFixedFields; spelling is a typo heuristic, not a dictionary"
  - id: m3-engine-step-9-mcp
    state: done
    what: "api/src/mcp/server.ts: tools tailor (job_id, force, dry_run), tailor_all_dry_run, render (resume_id), lint (resume_id); results are codes, ids, scores, questions, never resume text. The engine build order (engine-algorithm 10) is complete with this step."
    tests: "api/test/mcp-tools.test.ts starts the stdio server like Claude Code does, checks the tools are listed and answer errors cleanly; 48 tests total"
  - id: m3-bank-built
    state: done
    what: "Real bank built on local qwen2.5:14b (6 roles, 2 projects, 22 bullets; number check clean) after two fixes (streamed answers; capped lists). bank retag (new): local 14B suggests tags for bullets with < 5; a tag is kept only if the bullet's text names it (tags are evidence in scoring); text never changes. 15 bullets retagged; 4 still under 5 tags (their text names few skills): patch-infotech-4, atdrive-group-2, adadda-marketing-1, jobops-1"
    next: "user reviews profile/bank.yaml (Claude never reads it), adds tags by hand if wanted, then: node api/src/cli.ts bank approve"
  - id: editable-lists
    state: done
    what: "Synonyms and skill groups moved from code to YAML: api/config/synonyms.yaml and api/config/skill-groups.yaml (defaults, committed); profile/synonyms.yaml and profile/skill-groups.yaml (user's, git-ignored) win. api/src/lists.ts loads both, validates (a broken file is an error naming it), re-reads on change (MCP server sees edits). Tests point JOBOPS_PROFILE_DIR at a temp folder so user overrides never change results"
  - id: m3-review-findings
    state: deferred
    when: "later, after the template step (user 2026-10-27: leave it, keep a note)"
    why: "profile/reviews is free text and private (Claude never reads it), so the engine cannot map findings to actions yet; engine-algorithm 4 step 9 is not implemented"
    what: "review extract: local qwen2.5:14b turns profile/reviews/* once into profile/reviews/findings.yaml (id, kind from a fixed list: skills/ordering/summary/spelling/length/needs_facts, engine action); the user reviews and approves it like the bank; tailor loads approved findings, applies engine-fixable ones in code, stores review_findings [{id, status: addressed|open|needs_facts}] (ids only) and reports open ones; needs_facts findings become bullet-writing.md questions. Not chosen: a model call on every tailor (varies per run, unreviewed)"
  - id: m3-bank-schema-per-skill
    state: done
    what: "BulletSchema: ids <entry-id>-<n> or <entry-id>-<topic>; optional evidence (the user's answer) for source: user; checkBank flags user bullets without evidence and checks their numbers against the evidence. bullet add --topic --evidence. Skills: regroup (known frameworks out of languages and back) and dedupe on every save; bank dedupe command"
    bank: "user answered the question bank in chat (one-time exception, 2026-10-27): 6 user bullets added (4 schneider-electric, 2 jobops) with evidence; scale/load bullet waits on the user confirming the numbers are teams (40 design, 50 load test, 50 = ~250 engineers in one session)"
  - id: m3-content-equivalence-formula
    state: done
    decided: "m3-notes engine-algorithm 5: same id+text 1.0, alias->JD term 0.9, reworded 0.5, one side 0; summary 1 unit; skills 1 unit x Jaccard; 100 x matched / (bullet union + 2)"
    what: "define during the engine design session (proposal in chat: id+text = 1, reworded = 0.5, over the union, plus summary variant)"
  - id: m3-tests
    state: done
    what: "m3-notes engine-algorithm 8: 5 engine tests + 2 invariants on a fake resume; plus earlier cases for the built parts"
  - id: m3-bank-build
    state: done
    what: node api/src/cli.ts bank build on the real resume (local model), user review and approve profile/bank.yaml
  - id: product-provider-llama-cpp
    state: done
    what: move api/src/model/ollama.ts (JD parse, bank build, rewording) to the llama.cpp OpenAI-compatible API with json_schema; verified to work (6*7 test returned schema-valid JSON); then Ollama can be retired
  - id: rewording-model
    state: decided
    what: local qwen2.5:14b with the humanizer rules (prompt + ai_tell_added guard); user decision 2026-10-28, closes the flag

