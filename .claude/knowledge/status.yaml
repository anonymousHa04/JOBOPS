# JobOps work status: the single structured record of what is done and what is
# left. Indexed by the knowledge layer (retrieve.py) item by item, so it can be
# searched: retrieve.py semantic "what is left for the engine".
# Update it whenever an item changes state. States: done | in_progress | todo | blocked.
# Longer narrative lives in M3-NOTES.md and LOCAL-AGENTS.md; this file wins on state.
updated: 2026-10-26
branch: feedback

environment:
  - id: env-llama-cpp
    what: Local models run on llama.cpp (Homebrew llama.cpp 0.7.0, build 11669), not Ollama
    how: .claude/bin/llm.sh start|stop|status [coder|coder7|embed|all]
    servers:
      coder: 127.0.0.1:8081, qwen2.5-coder-14b, 16k context, q8 KV cache, flash attention
      coder7: 127.0.0.1:8083, qwen2.5-coder-7b, 16k context (never together with coder)
      embed: 127.0.0.1:8082, mxbai-embed-large, CLS pooling, 512-token input
    models: GGUF files from Ollama's store, linked into ~/models/jobops/ (no second download)
    note: A request over the window is rejected (HTTP 400) and flagged as RUN-CODER CONTEXT OVERFLOW; never silently truncated.
  - id: env-index-refresh
    what: The Qdrant index is written only after an accepted task (autofix.sh on pass), not before runs (user, 2026-10-26), and only from the main checkout; worktrees search it read-only
    note: "One point per chunk (per heading, declaration, or YAML item), so a file appears many times with different line ranges; that is intended. Stale points from old versions are pruned on the next write (123 removed 2026-10-26; now 423 points = 423 chunks)."
  - id: env-qdrant
    what: Qdrant v1.19.2 in Docker (infra/qdrant/docker-compose.yml), 127.0.0.1:6333, data in data/qdrant, telemetry off
  - id: env-ollama
    what: Ollama stays installed only because the JobOps product code (api/src/model/ollama.ts) still calls it; see todo product-provider-llama-cpp
  - id: env-memory
    what: 16 GB Mac. Docker Desktop VM capped at 2 GB (MemoryMiB 2048 in ~/Library/Group Containers/group.com.docker/settings-store.json; backup .bak-2026-10-26)
    state: done
    evidence: "before: Docker VM 8.3 GB, swapping 10,228 pages per 10 s idle; after: VM 2.06 GB, 0 swapouts, 77% memory free; Qdrant back with 415 points"

