milestone_3:
  # Product work, branch m3-engine. Engine spec: the m3-notes skill
  # (.agents/skills/m3-notes, mirrored in .claude/skills/m3-notes), adopted 2026-10-27;
  # where it differs from M3-NOTES.md, the skill wins.
  - id: m3-engine-spec
    state: done
    what: "m3-notes skill installed for Claude Code and shared agents; local coders get its matching sections through the context package's playbook section"
    changes_needed: "scoring to 55 must / 15 themes / 10 nice / 20 keywords with recency and must-have caps, labels supported_metric and skill_list_only; inverted index plus LLM judge for qualified requirements and index misses; evidence field on user bullets (number check against the answer); decision: reuse at equivalence >= 95 for any tailorable band, risk gate before rewording, tailor --all --dry-run; guard codes number_added, term_added, scope_raised, scope_phrase_added, too_long, fixed_field_changed; records in profile/records with content, bank, and engine hashes"
    work_split: "manager: ideal, equivalence, decide, guard, scoring and their tests; local coders: tailor CLI, MCP tool, YAML writer, prompt-3 wiring, lint"
    decisions_digest: "m3-notes references/decisions.md (2026-10-27): every agreed decision in one file; always included in full in context packages for product code (api/, jd-search/); context budgets raised to 4500 (aider) and 4000 (mini) to keep room for code context"
    review_aware: "tailoring loads profile/reviews/* locally, maps findings to engine actions or user questions, stores finding ids + status in the record (never the text), reports open ones"
  - id: m3-engine
    state: blocked
    blocked_on: user go-ahead; content equivalence formula
    what: selection, content equivalence, rewrite check, resume records, tailoring (requierements/jobops_resume_selection_generation_engine.md)
  - id: m3-engine-step-1a-scoring
    state: done
    what: "scoring per m3-notes engine-algorithm 2-3: inverted index over bullet text and tags; labels supported_metric/supported/partial/skill_list_only/learnable/not_demonstrated/unknown with credits x recency; 55 must / 15 themes / 10 nice / 20 literal keywords (must-have keywords x2), empty parts redistributed; must-have caps 84.9 / 74.9; years gate; index misses are unknown (never auto not_demonstrated); qualified requirements partial until judged; verdicts slot for the judge; risk check uses credit < 0.5"
    evidence: "fake-bank smoke 2026-10-27: every credit, cap, redistribution, and keyword weight matched by hand; check.sh pass, self-test 29/29, eval 44/44 (eval budget aligned to 4500)"
  - id: m3-engine-step-1b-judge
    state: done
    what: "api/src/scoring/judge.ts: local qwen2.5:7b (general7) judges needsJudge() requirements; candidates = index hits, else word-stem overlap, else most recent high-impact bullets (the model always decides); invented ids dropped; verdicts cached in SQLite judge_cache by requirement + prompt/candidate-logic version + bank hash; a judge 'no' keeps a listed skill at skill_list_only; score judges first (cache), --no-judge / judge=false uses cache only; risk uses cached verdicts; server down -> index labels + reported error"
    evidence: "fake JD 2026-10-27: judged 4 (production Kubernetes partial, Rust not_demonstrated by the model, Kafka/Go skill_list_only), re-score fully cached, --no-judge works, server down reported with the start command; check.sh pass, self-test 29/29, eval 44/44"
    calibrate: "generic tag matches (e.g. theme 'system design' supported via tag 'design') may be generous; tune on real JDs"
  - id: m3-engine-step-2-core
    state: done
    what: "api/src/tailor/ideal.ts (ideal content: must-have coverage first, then themes, impact, recency, id; budgets; every role >= 1 bullet; <= 2 metric-led per role; starting record's wording reused; reword marks for JD keywords missing literally, alias-only flagged; skills JD-first in JD spelling, nothing added; summary variant as written), equivalence.ts (spec 5 formula), decide.ts (pickStart on cached verdicts; years gate / poor bands -> not_tailored; reuse at >= 95; flags for unsupported must-haves and risks; risk gate blocks adapt, never reuse)"
    tests: "api/test/m3-engine.test.ts, 7 tests from engine-algorithm 8 plus invariants, fake resume only; total 29 tests pass"
    open: "spec 5 formula (union + 2, with a skills unit) vs its worked examples (union + 1): implemented as written; decisions identical, numbers differ slightly (one swap 88.2% vs 87.5% at 14 bullets) - user to confirm"
  - id: m3-engine-step-3-records
    state: done
    what: "api/src/tailor/records.ts: one YAML per JD in profile/records/ (id = jd id + content hash; original resume is record 'original'), written with wx so never overwritten; SQLite resume_records is an index rebuilt from YAML by loadRecords; content hash (sorted keys, reword marks excluded), bank hash, engine version (config values + judge prompt + logic version); hand-edited records reported and left out, stale bank/engine reported. ResumeRecordSchema replaced (decision original/reuse/adapt/not_tailored, flags, review_findings ids+statuses, hashes); old empty resume_records table dropped on open"
    tests: "3 record tests in api/test/m3-engine.test.ts"
  - id: m3-engine-step-4-guard
    state: done
    what: "api/src/tailor/guard.ts: checkRewrite (number_added, term_added except the bullet's reword keywords, scope_raised on the verb ladder, scope_phrase_added, too_long, number_led), checkFixedFields (title/company/dates byte-match the bank), guardedReword (one attempt, one retry with codes, then bank text; codes only)"
    tests: "3 guard tests in api/test/m3-engine.test.ts; total 35 tests pass"
    next: "step 5 rewording: prompt 3 on general7 through guardedReword (local coders: prompt-3 wiring)"
  - id: m3-bank-schema-per-skill
    state: todo
    what: "skill bank entries: ids like <roleprefix>-<topic> and an evidence field for source: user (number check against the user's answer); current BulletSchema requires ids ending in a number and has no evidence"
  - id: m3-content-equivalence-formula
    state: done
    decided: "m3-notes engine-algorithm 5: same id+text 1.0, alias->JD term 0.9, reworded 0.5, one side 0; summary 1 unit; skills 1 unit x Jaccard; 100 x matched / (bullet union + 2)"
