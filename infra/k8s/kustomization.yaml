# Kustomize: the list of files that make up JobOps in Kubernetes. `kubectl apply -k infra/k8s`
# reads this file and sends every resource below to the cluster in one go. bin/jobops does
# that for you (it also fills in the profile path, see the note in api.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobops          # every resource below lands in this namespace
resources:
  - namespace.yaml
  - config.yaml
  - storage.yaml
  - queue.yaml
  - api.yaml
  - workers.yaml
  - gateway.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: jobops
