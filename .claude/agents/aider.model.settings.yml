# aider model settings for the llama.cpp servers (.claude/bin/llm.sh).
# Passed explicitly by run-coder.sh (--model-settings-file), so worktrees at
# older commits use the same settings.
# The repo map is off: the knowledge layer's context package replaces it, and
# the map alone used 4,096 tokens and overflowed the window (m3-05-kb).
- name: openai/qwen2.5-coder-14b
  edit_format: whole
  use_repo_map: false
  use_temperature: true
  extra_params:
    temperature: 0
    max_tokens: 4096
- name: openai/qwen2.5-coder-7b
  edit_format: whole
  use_repo_map: false
  use_temperature: true
  extra_params:
    temperature: 0
    max_tokens: 4096
