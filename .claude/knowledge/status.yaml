    state: in_progress
    built: ".claude/bin/feedback.py + autofix.sh: per-attempt record (agent_claim, failure category from doc 6.4, failure signature, fixes supplied), fresh repair round with new evidence (FIX_RUNNER aider, MAX_FIXES 1), stop on repeated signature / environment / validation / context / timeout / retry limit, escalation record (.agent-logs/<task>.escalation.json + main .agent-logs/escalations.jsonl), fix promotion with evidence, outcomes.jsonl for Phase 4"
    evidence: "selftest 25/25 (12 phase-0 + 13 feedback-loop checks) on 2026-10-26"
    acceptance: "m3-05-fb PASSED on the first attempt (aider's lint loop fixed its own errors; 4 requests, 6.5k-13k tokens; claim STATUS done). Behavior check on a fake profile: all 11 exports, YAML round trip, checkBank flags exactly the planted issues, addSkill and vocabulary correct. One gap: hard-coded ./profile, because run-plan.sh dropped the plan's shared rules (fixed, verified by a split test). Evidence: .agent-logs/runs/m3-05-fb/"
    left: "not yet exercised for real: a repair round that passes and promotes a fix (self-test covers it with a fake agent)"
    first: "capture agent self-reports as agent_claim (mini trajectory via -o and stop reason; aider STATUS/BLOCKERS block), failure category per doc 6.4"
    what: outcome record per task, failure categories (doc 6.4), retries with new evidence, failure signatures, real escalation handoff, verified-fix promotion
    exists: per-task result.json, fixes.jsonl with evidence statuses
  - id: phase-4-measurement
    state: done
    closed: "2026-10-26; round 2 replaced by direct verification of the fixes (self-test 29/29), see phase4.yaml results"
    plan: ".claude/knowledge/phase4.yaml (metrics, baseline, criteria written before the runs); harness .claude/bin/phase4-bench.sh; scoring .claude/bin/metrics.py"
    round_1: "10 runs 2026-10-26 (report .agent-logs/phase4/report.json): first-attempt 0.3 (criterion 0.4: NO), final 0.7 (yes), escalations 0.3 (yes), repair 4/7, repeated-failure stop 2/2, regression 0.06 (NO, artifact), overflow 0, median context 3410, median runtime 7.9 min, self-test 25/25. Baseline M3: first-attempt 2/7 check-pass (0/7 correct), escalations 4/7."
    findings: "1) diff edit format: aider wrote new files to a doubled path (api/src/model/api/src/model/ollama.ts, m3-03 x2) and repair SEARCH blocks failed to match (NO EDIT APPLIED, m3-05 x2). 2) a rejected attempt's out-of-boundary file stayed in the tree for the repair round (the 'regression' is that stale file). 3) mini left api/src/db.ts.tmp, so a good edit was rejected (m3-07 r2). 4) metrics counted 'did not resolve' notes as promotions (fixed). 5) model still imports node-fetch / abort-controller (m3-03 r2) despite the verified fix in context."
    next: "done: whole format default, revert out-of-boundary files, drop mini temp files, wrong-path -> environment, fixes lock, two fixes recorded; verified by self-test 29/29"
    what: first-attempt acceptance, repair attempts, escalations, context size, runtime; compare with the M3 baseline (0/7 first-try)
